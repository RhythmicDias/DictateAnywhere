name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Run unit tests ───────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install sounddevice numpy webrtcvad-wheels keyring pyperclip
          pip install -e . --no-deps

      - name: Run tests
        run: pytest tests/ -v --tb=short -k "not test_azure and not test_keyring"

  # ── Build Tauri Windows Installers (.msi & .exe) ─────────────────────────────
  build-tauri:
    name: Build Windows Installers
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar Binary
        run: |
          python scripts/build_sidecar.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "DictateAnywhere v__VERSION__"
          releaseBody: "DictateAnywhere v__VERSION__ — Hybrid local voice dictation for Windows.\n\nDownload `DictateAnywhere___VERSION___x64-setup.exe` for the one-click installer (recommended) or the `.msi` package."
          releaseDraft: false
          prerelease: false
